name: Release
on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clone scoda-engine
        uses: actions/checkout@v4
        with:
          repository: jikhanjung/scoda-engine
          path: scoda-engine
      - name: Install dependencies
        run: |
          pip install -e "./scoda-engine/core"
          pip install -e "./scoda-engine"
      - name: Build database
        run: |
          python scripts/create_database.py
          python scripts/build_correlation.py
          python scripts/add_scoda_tables.py
      - name: Build .scoda package
        run: python scripts/create_scoda.py
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "KStrati v${{ steps.version.outputs.VERSION }}"
          body: |
            ## KStrati v${{ steps.version.outputs.VERSION }}

            Korean stratigraphic and biozone database for the Taebaeksan Basin (Cambrian–Ordovician).

            ### Package contents
            - Taebaek Group (태백층군) — 10 formations, Hwangho province
            - Yeongwol Group (영월층군) — 5 formations, Jiangnan province
            - 39 biozones with provenance-tracked occurrences and age assignments
            - Correlation chart with rowspan-based rendering
          files: |
            dist/*.scoda
            dist/*.manifest.json
          draft: false
          prerelease: false
